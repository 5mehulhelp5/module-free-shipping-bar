<!--
/**
 * Free shipping bar — header minicart and Ajax Cart Pro popup.
 */
-->
<div class="fsbar"
     if="isVisible()"
     css="modifierClass() + (isQualified() ? ' fsbar--qualified' : '')"
     attr="{'data-fsbar-source': bar().source}">
    <p class="fsbar__message" text="message()"></p>
    <div class="fsbar__track"
         role="progressbar"
         aria-valuemin="0"
         aria-valuemax="100"
         attr="{'aria-valuenow': ariaValue(), 'aria-label': message()}">
        <span class="fsbar__fill" data-bind="style: {width: width()}"></span>
    </div>
</div>
